<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قالب «3 أشياء»</title>
<!-- قالب «3 أشياء…»: افتتاح بثلاث بطاقات مقلوبة، ثم كل بطاقة تنقلب ويظهر نصها كلمة كلمة (وشرحها إن طُلب)، ثم خاتمة تسأل المشاهد.
     البيانات في window.DATA يحقنها render.mjs من ملف الفيديو (tiktok/videos/*.json) مع نصوص البطاقات من public/cards.json كما هي. -->
<link rel="stylesheet" href="common.css">
<style>
.backs .back{width:330px;height:480px}
.nb{position:absolute;top:-28px;left:50%;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;background:var(--gold);color:#12201c;display:grid;place-items:center;font:700 40px Tajawal;box-shadow:0 0 0 6px var(--bg)}
.mini{width:300px;height:400px;border-radius:32px;padding:14px;background:var(--frame);box-shadow:0 30px 60px rgba(0,0,0,.5)}
.mini .in{width:100%;height:100%;border-radius:20px;background:#f7f1e2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;text-align:center;color:var(--tc);box-shadow:0 0 0 2px color-mix(in srgb,var(--cg) 55%,transparent) inset}
.mini b{width:64px;height:64px;border-radius:50%;background:var(--nb);color:#fff;display:grid;place-items:center;font:700 34px Tajawal}
.mini span{font:700 46px/1.4 Amiri,serif}
</style>
</head>
<body>
<div id="bg" class="abs"></div>
<div id="pat" class="abs"></div>
<div id="root"></div>
<div id="vig" class="abs"></div>
<script src="common.js"></script>
<script>
const D = window.DATA;
const N = D.items.length;
const plain = s => s.replace(/[\[\]]/g, '').replace(/_/g, ' ');

// 0) الافتتاح: ثلاث بطاقات مقلوبة مرقّمة
scene(6.0, (el, s) => {
  const ch = chrome(el, s, { title: D.title, sub: D.hookSub, subStart: .55 });
  const backs = D.items.map((_, i) => { const b = h(`<div class="back abs" style="width:330px;height:480px">${MIHRAB}<div class="nb">${i + 1}</div></div>`); el.appendChild(b); return b; });
  backs.forEach((_, i) => sfx(s.start + 1.0 + i * .5, 'pop', .8 + i * .1));
  return lt => {
    ch(lt);
    backs.forEach((b, i) => {
      const p = back(seg(lt, .95 + i * .5, .8)), f = eo(seg(lt, 1.05 + i * .5, 1.3)), k = 1 - i; // يمين → يسار
      css(b, { left: (375 + k * 300 * f) + 'px', top: (600 + Math.abs(k) * 40 * f + (1 - p) * 500) + 'px', opacity: clamp(p * 1.4),
        transform: `rotate(${k * 9 * f + Math.sin(lt * 1.3 + i) * 1.2}deg)`, zIndex: i === 1 ? 3 : 1 });
    });
  };
});

// 1..N) كل بطاقة: تنقلب، يظهر نصها، ثم الشرح إن طُلب (cardScene في common.js)
D.items.forEach((it, idx) => cardScene(it, [idx + 1, N, it.topic]));

// الخاتمة: البطاقات الثلاث معًا وسؤال للمشاهد
scene(5.6, (el, s) => {
  const ch = chrome(el, s, { title: D.outroTitle, sub: D.outroSub, subStart: 1.6 });
  const minis = D.items.map((it, i) => { const m = h(`<div class="mini abs ${it.card.theme || 'ivory'}"><div class="in"><b>${i + 1}</b><span>${plain(it.short || it.card.title)}</span></div></div>`); el.appendChild(m); return m; });
  minis.forEach((_, i) => sfx(s.start + .5 + i * .18, 'check', .6));
  sfx(s.start + 1.2, 'chime', .5);
  return lt => {
    ch(lt);
    minis.forEach((m, i) => {
      const p = back(seg(lt, .4 + i * .18, .5)), k = 1 - i;
      css(m, { left: (390 + k * 320) + 'px', top: (640 + (1 - p) * 300) + 'px', opacity: clamp(p * 1.4), transform: `rotate(${k * 4}deg) scale(${.9 + .1 * p + .01 * Math.sin(lt * 2 + i)})` });
    });
  };
});

finish();
</script>
</body>
</html>
