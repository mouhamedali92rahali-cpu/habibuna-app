<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قالب «3 أشياء»</title>
<!-- قالب «3 أشياء…»: افتتاح بثلاث بطاقات مقلوبة، ثم كل بطاقة تنقلب ويظهر نصها كلمة كلمة (وشرحها إن طُلب)، ثم خاتمة تسأل المشاهد.
     البيانات في window.DATA يحقنها render.mjs من ملف الفيديو (tiktok/videos/*.json) مع نصوص البطاقات من public/cards.json كما هي. -->
<link rel="stylesheet" href="common.css">
<style>
.backs .back{width:330px;height:480px}
.nb{position:absolute;top:-28px;left:50%;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;background:var(--gold);color:#12201c;display:grid;place-items:center;font:700 40px Tajawal;box-shadow:0 0 0 6px var(--bg)}
.panel{left:90px;right:90px;top:1000px;border-radius:40px;background:#13221e;border:2px solid rgba(217,178,94,.3);padding:40px 48px 34px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.panel h3{font:700 60px/1.4 Amiri,serif;color:var(--ivory)}
.panel p{font:400 42px/1.85 Naskh,Amiri,serif;color:#efe8d4;margin-top:12px}
.panel p .w{margin:0 .06em}
.panel small{display:block;margin-top:14px;font:400 28px Tajawal;color:var(--muted)}
.mini{width:300px;height:400px;border-radius:32px;padding:14px;background:var(--frame);box-shadow:0 30px 60px rgba(0,0,0,.5)}
.mini .in{width:100%;height:100%;border-radius:20px;background:#f7f1e2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;text-align:center;color:var(--tc);box-shadow:0 0 0 2px color-mix(in srgb,var(--cg) 55%,transparent) inset}
.mini b{width:64px;height:64px;border-radius:50%;background:var(--nb);color:#fff;display:grid;place-items:center;font:700 34px Tajawal}
.mini span{font:700 46px/1.4 Amiri,serif}
</style>
</head>
<body>
<div id="bg" class="abs"></div>
<div id="pat" class="abs"></div>
<div id="root"></div>
<div id="vig" class="abs"></div>
<script src="common.js"></script>
<script>
const D = window.DATA;
const N = D.items.length;
const plain = s => s.replace(/[\[\]]/g, '').replace(/_/g, ' ');

// 0) الافتتاح: ثلاث بطاقات مقلوبة مرقّمة
scene(6.0, (el, s) => {
  const ch = chrome(el, s, { title: D.title, sub: D.hookSub, subStart: .55 });
  const backs = D.items.map((_, i) => { const b = h(`<div class="back abs" style="width:330px;height:480px">${MIHRAB}<div class="nb">${i + 1}</div></div>`); el.appendChild(b); return b; });
  backs.forEach((_, i) => sfx(s.start + 1.0 + i * .5, 'pop', .8 + i * .1));
  return lt => {
    ch(lt);
    backs.forEach((b, i) => {
      const p = back(seg(lt, .95 + i * .5, .8)), f = eo(seg(lt, 1.05 + i * .5, 1.3)), k = 1 - i; // يمين → يسار
      css(b, { left: (375 + k * 300 * f) + 'px', top: (600 + Math.abs(k) * 40 * f + (1 - p) * 500) + 'px', opacity: clamp(p * 1.4),
        transform: `rotate(${k * 9 * f + Math.sin(lt * 1.3 + i) * 1.2}deg)`, zIndex: i === 1 ? 3 : 1 });
    });
  };
});

// 1..N) كل بطاقة: تنقلب، يظهر نصها، ثم الترجمة، ثم الشرح إن طُلب
D.items.forEach((it, idx) => {
  const c = it.card;
  const tmp = h(`<div>${words(c.text)}</div>`); const n = wordCount(tmp);
  const T = 1.85, textEnd = T + n * .2 + .3, readEnd = textEnd + 2.6;
  const withSharh = !!(it.sharhTitle && c.sharh);
  const sharhN = withSharh ? c.sharh.text.split(' ').length : 0;
  const P = readEnd, sharhStart = P + 1.0, dur = withSharh ? sharhStart + .6 + sharhN * .08 + 5.5 : readEnd;
  scene(dur, (el, s) => {
    const ch = chrome(el, s, { step: [idx + 1, N, it.topic], title: it.label });
    const flip = h(`<div class="flip abs" style="left:110px;top:560px;width:860px;height:760px"><div class="back">${MIHRAB}</div><div class="face">${cardFace(c)}</div></div>`);
    el.appendChild(flip);
    const [bk, face] = flip.children, tx = face.querySelector('.ctext'), su = el.querySelector('.sub');
    let panel = null, pt = null;
    if (withSharh) {
      panel = h(`<div class="panel abs"><h3>${words(it.sharhTitle)}</h3><p>${words(c.sharh.text)}</p><small>${c.sharh.source}</small></div>`);
      el.appendChild(panel); pt = panel.querySelector('p');
      sfx(s.start + P + .1, 'whoosh', .5); sfx(s.start + sharhStart, 'pop', .8);
    }
    sfx(s.start + 1.3, 'pop');
    return lt => {
      ch(lt);
      // الصعود ثم القلب من الظهر إلى الوجه
      const up = back(seg(lt, .7, .55)), rot = 180 * (1 - eo(seg(lt, 1.1, .7)));
      bk.style.transform = `rotateY(${rot - 180}deg)`; face.style.transform = `rotateY(${rot}deg)`;
      const shrink = withSharh ? eo(seg(lt, P, .8)) : 0;
      css(flip, { opacity: clamp(up * 1.5), transform: `translateY(${(1 - up) * 160 - shrink * 120}px) scale(${(.92 + .08 * up) * (1 - .4 * shrink)})`, transformOrigin: '50% 0%' });
      revealWords(tx, lt, T, .2, { dy: 14, blur: 6 });
      if (withSharh) {
        if (su) su.style.visibility = lt > P + .5 ? 'hidden' : '';
        if (su) css(su, { opacity: 1 - seg(lt, P, .4) });
        const q = back(seg(lt, sharhStart - .2, .6));
        css(panel, { opacity: clamp(q * 1.5), transform: `translateY(${(1 - q) * 80}px)` });
        revealWords(panel.querySelector('h3'), lt, sharhStart, .12, { dy: 20 });
        revealWords(pt, lt, sharhStart + .5, .08, { dy: 10, blur: 4 });
        panel.querySelector('small').style.opacity = eo(seg(lt, sharhStart + .6 + sharhN * .08, .5)) * .9;
      }
    };
  });
});

// الخاتمة: البطاقات الثلاث معًا وسؤال للمشاهد
scene(5.6, (el, s) => {
  const ch = chrome(el, s, { title: D.outroTitle, sub: D.outroSub, subStart: 1.6 });
  const minis = D.items.map((it, i) => { const m = h(`<div class="mini abs ${it.card.theme || 'ivory'}"><div class="in"><b>${i + 1}</b><span>${plain(it.short || it.card.title)}</span></div></div>`); el.appendChild(m); return m; });
  minis.forEach((_, i) => sfx(s.start + .5 + i * .18, 'check', .6));
  sfx(s.start + 1.2, 'chime', .5);
  return lt => {
    ch(lt);
    minis.forEach((m, i) => {
      const p = back(seg(lt, .4 + i * .18, .5)), k = 1 - i;
      css(m, { left: (390 + k * 320) + 'px', top: (640 + (1 - p) * 300) + 'px', opacity: clamp(p * 1.4), transform: `rotate(${k * 4}deg) scale(${.9 + .1 * p + .01 * Math.sin(lt * 2 + i)})` });
    });
  };
});

finish();
</script>
</body>
</html>
