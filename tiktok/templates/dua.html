<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قالب «الدعاء»</title>
<!-- قالب «الدعاء» (الاثنين والخميس كما في التطبيق): البطاقة كاملة بمصدرها، ثم لفظ الدعاء وحده بخط كبير ليُحفظ، ثم كود التحميل.
     لفظ الدعاء هو ما بين «» في نص البطاقة كما هو. البيانات: {topic, items:[{id, label, sharhTitle?}], memTitle, memSub} -->
<link rel="stylesheet" href="common.css">
<style>
.mem{left:60px;right:60px;top:540px;min-height:760px;display:flex;flex-direction:column;justify-content:center;padding:90px 60px;border-radius:48px;background:radial-gradient(120% 90% at 50% 0%,#174f43,#10241f 70%);
  border:3px solid rgba(217,178,94,.55);text-align:center;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 12px rgba(217,178,94,.08)}
.mem .corner{width:90px;height:90px;color:#d9b25e}
.mem p{font:700 84px/1.8 Amiri,serif;color:var(--ivory)}
.mem p .w{margin:0 .08em}
.mem small{display:block;margin-top:26px;font:400 32px Tajawal;color:var(--muted)}
</style>
</head>
<body>
<div id="bg" class="abs"></div>
<div id="pat" class="abs"></div>
<div id="root"></div>
<div id="vig" class="abs"></div>
<script src="common.js"></script>
<script>
const D = window.DATA;
const it = D.items[0], c = it.card;
// قاعدة البقاء 5 (أرقام فيديو 004): المحتوى من أول لقطة. لفظ الدعاء بخط كبير وفوقه العنوان، ثم البطاقة بمصدرها لمن بقي.
const quote = c.text.slice(c.text.indexOf('«') + 1, c.text.lastIndexOf('»'));
const qn = quote.split(' ').length, QS = .12, qEnd = .1 + qn * QS + .3;
const subStart = qEnd + .2, subN = D.memTitle.split(' ').length;
scene(Math.max(qEnd + 3.2, subStart + subN * .26 + 2.0), (el, s) => {
  const ch = chrome(el, s, { step: D.topic, title: it.label, sub: D.memTitle, subStart, subStep: .26 });
  const m = h(`<div class="mem abs">${corners()}<p>${words(quote)}</p></div>`); el.appendChild(m);
  const extra = Math.max(0, Math.min(ch.titleEl.offsetHeight, 290) - 150); m.style.top = (540 + extra) + 'px';
  const p = m.querySelector('p');
  sfx(s.start + qEnd, 'chime', .4);
  return lt => {
    ch(lt);
    css(m, { opacity: eo(seg(lt, 0, .25)) });
    revealWords(p, lt, .1, QS, { dy: 16, blur: 6 });
    const g = seg(lt, qEnd, 1.2); m.style.boxShadow = `0 40px 90px rgba(0,0,0,.5),0 0 0 ${12 + 20 * eo(g)}px rgba(217,178,94,${.08 + .12 * Math.sin(Math.PI * g)})`;
  };
});

// 2) البطاقة مفتوحة بمصدرها ودرجتها
it.open = true; it.hold = it.hold || 2.4;
cardScene(Object.assign({}, it, { label: D.cardTitle || '[المصدر] والدرجة' }), D.topic);

qrScene();
finish();
</script>
</body>
</html>
