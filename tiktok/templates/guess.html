<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قالب «خمّن»</title>
<!-- قالب «خمّن»: سؤال (هو الهوك، يظهر من أول نصف ثانية) ثم عدّ تنازلي 3-2-1 يفكّر فيه المشاهد في الجواب (التعليق يُطلب في الخاتمة لا أثناء العدّ)، ثم البطاقة جوابًا (وشرحها إن طُلب)، ثم «هل أصبت؟».
     البيانات في window.DATA يحقنها render.mjs: {question, topic, items:[{id, label, sharhTitle?}], outroTitle, outroSub} -->
<link rel="stylesheet" href="common.css">
<style>
.ques{left:70px;right:70px;top:560px;padding:56px 50px;border-radius:44px;background:#13221e;border:2px solid rgba(217,178,94,.35);text-align:center;box-shadow:0 40px 90px rgba(0,0,0,.5)}
.ques p{font:700 78px/1.6 Amiri,serif;color:var(--ivory)}
.ques .mark{position:absolute;top:-52px;left:50%;transform:translateX(-50%);width:104px;height:104px;border-radius:50%;background:var(--gold);color:#12201c;display:grid;place-items:center;font:700 64px Amiri,serif;box-shadow:0 0 0 8px var(--bg)}
.count{left:390px;top:1050px;width:300px;height:300px}
.count svg{position:absolute;inset:0}
.count b{position:absolute;inset:0;display:grid;place-items:center;font:700 150px Tajawal;color:var(--ivory)}
.bubble{left:300px;top:560px;width:480px;height:480px;display:grid;place-items:center}
</style>
</head>
<body>
<div id="bg" class="abs"></div>
<div id="pat" class="abs"></div>
<div id="root"></div>
<div id="vig" class="abs"></div>
<script src="common.js"></script>
<script>
const D = window.DATA;
const it = D.items[0];

// 1) السؤال والعدّ التنازلي
const Q0 = 1.5; // «خمّن الجواب» وحده قبل السؤال
const qN = D.question.split(' ').length, qEnd = Q0 + qN * .25 + .3;
const thinkN = (D.thinkSub || 'فكّر في [جوابك] .. قبل أن ترى البطاقة').split(' ').length;
const subStart = qEnd + .1, cs = subStart + thinkN * .27 + .4;
scene(cs + 3.25, (el, s) => {
  const ch = chrome(el, s, { step: D.topic, title: 'خمّن [الجواب]', sub: D.thinkSub || 'فكّر في [جوابك] .. قبل أن ترى البطاقة', subStart });
  const q = h(`<div class="ques abs"><div class="mark">؟</div><p>${words(D.question)}</p></div>`); el.appendChild(q);
  const R = 130, C = 2 * Math.PI * R;
  const cnt = h(`<div class="count abs"><svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="${R}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="14"/>
    <circle id="arc" cx="150" cy="150" r="${R}" fill="none" stroke="#d9b25e" stroke-width="14" stroke-linecap="round" transform="rotate(-90 150 150)" stroke-dasharray="${C}"/></svg><b>3</b></div>`);
  el.appendChild(cnt);
  const arc = cnt.querySelector('#arc'), num = cnt.querySelector('b');
  qWords(q, s);
  [0, 1, 2].forEach(k => sfx(s.start + cs + k, 'beat'));
  return lt => {
    ch(lt);
    const p = back(seg(lt, Q0 - .35, .5)); css(q, { opacity: clamp(p * 1.5), transform: `scale(${.92 + .08 * p})` });
    revealWords(q.querySelector('p'), lt, Q0, .25, { dy: 30, blur: 10 });
    const c = eo(seg(lt, cs - .5, .5)); css(cnt, { opacity: c, transform: `scale(${.7 + .3 * c})` });
    const e = clamp((lt - cs) / 3);
    arc.setAttribute('stroke-dashoffset', C * e);
    const k = Math.min(2, Math.max(0, Math.floor(lt - cs))), f = seg(lt, cs + k, .3);
    num.textContent = 3 - k;
    css(num, { transform: `scale(${1.25 - .25 * eo(f)})`, opacity: lt < cs ? 1 : .4 + .6 * eo(f) });
  };
});
// نقرة لكل كلمة من السؤال (نص كتبناه نحن لا نص البطاقة)
function qWords(q, s) { wordTimes(q.querySelector('p'), Q0, .25).forEach((t, i) => sfx(s.start + t, 'tick', i % 2 ? .85 : 1)); }

// 2) الجواب: البطاقة نفسها
const ans = cardScene(it, 'الجواب');
sfx(ans.start + 1.85, 'chime', .45);

// 3) الخاتمة
scene(5.2, (el, s) => {
  const ch = chrome(el, s, { title: D.outroTitle, sub: D.outroSub, subStart: 1.3 });
  const b = h(`<div class="bubble abs"><div class="abs" style="inset:-60px;border-radius:50%;background:radial-gradient(circle,rgba(217,178,94,.3),transparent 65%)"></div>
    <svg viewBox="0 0 24 24" width="340" height="340" fill="none" stroke="#d9b25e" stroke-width="1.3" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H10l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="rgba(217,178,94,.1)"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01" stroke-width="2.4" stroke-linecap="round"/></svg></div>`);
  el.appendChild(b);
  sfx(s.start + .4, 'pop');
  return lt => {
    ch(lt);
    const p = back(seg(lt, .3, .7)); css(b, { opacity: clamp(p * 1.5), transform: `scale(${.6 + .4 * p + .02 * Math.sin(lt * 2.6)})` });
  };
});

qrScene();
finish();
</script>
</body>
</html>
