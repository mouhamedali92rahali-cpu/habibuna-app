<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قالب «بطاقة بقصتها»</title>
<!-- قالب «بطاقة بقصتها»: سؤال الهوك وحده، ثم راوي القصة (من hadith.narrator في البطاقة)، ثم البطاقة، ثم شرحها، ثم دعوة للمشاركة، ثم كود التحميل.
     البيانات: {topic, hook, items:[{id, label, sharhTitle}], outroTitle, outroSub} -->
<link rel="stylesheet" href="common.css">
<style>
.narr{left:120px;right:120px;top:700px;padding:56px 40px;border-radius:44px;background:#13221e;border:2px solid rgba(217,178,94,.3);text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.narr .k{font:400 40px Tajawal;color:var(--muted)}
.narr .n{font:700 92px/1.5 Amiri,serif;color:var(--gold);margin-top:10px}
.narr svg{color:var(--gold);margin-bottom:14px}
.heart{left:340px;top:560px;width:400px;height:400px}
</style>
</head>
<body>
<div id="bg" class="abs"></div>
<div id="pat" class="abs"></div>
<div id="root"></div>
<div id="vig" class="abs"></div>
<script src="common.js"></script>
<script>
const D = window.DATA;
const it = D.items[0], c = it.card;
const narrator = (c.hadith && c.hadith.narrator) || '';
it.hold = it.hold || 3.4;

// 1) سؤال الهوك وحده، ثم راوي القصة
const hookEnd = .12 + D.hook.split(' ').length * TITLE_STEP + .3;
const N0 = hookEnd + 1.6;
scene(N0 + 3.4, (el, s) => {
  const ch = chrome(el, s, { step: D.topic, title: D.hook });
  const nb = h(`<div class="narr abs"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 6.5C10 5 7 4.5 3 5v13c4-.5 7 0 9 1.5 2-1.5 5-2 9-1.5V5c-4-.5-7 0-9 1.5z"/><path d="M12 6.5v13"/></svg>
    <div class="k">يروي القصة</div><div class="n">${narrator}</div></div>`);
  el.appendChild(nb);
  sfx(s.start + N0, 'pop', .8);
  return lt => {
    ch(lt);
    const p = back(seg(lt, N0, .6)); css(nb, { opacity: clamp(p * 1.5), transform: `translateY(${(1 - p) * 80}px) scale(${.94 + .06 * p})` });
  };
});

// 2) البطاقة ثم شرحها
cardScene(it, D.topic);

// 3) دعوة للمشاركة
scene(5.6, (el, s) => {
  const ch = chrome(el, s, { step: D.topic, title: D.outroTitle, sub: D.outroSub, subStart: 1.6 });
  const hb = h(`<div class="heart abs"><div class="abs" style="inset:-60px;border-radius:50%;background:radial-gradient(circle,rgba(217,178,94,.3),transparent 65%)"></div>
    <svg viewBox="0 0 24 24" width="400" height="400" fill="rgba(217,178,94,.12)" stroke="#d9b25e" stroke-width="1.2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></div>`);
  el.appendChild(hb);
  sfx(s.start + .5, 'pop');
  return lt => {
    ch(lt);
    const p = back(seg(lt, .4, .7)), beat = 1 + .04 * Math.max(0, Math.sin(lt * 4.2));
    css(hb, { opacity: clamp(p * 1.5), transform: `scale(${(.6 + .4 * p) * beat})` });
  };
});

qrScene();
finish();
</script>
</body>
</html>
