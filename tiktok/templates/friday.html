<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قالب «الجمعة»</title>
<!-- قالب «الجمعة»: العنوان وحده (الهوك)، ثم بطاقة الجمعة (Z07 كما في التطبيق)، ثم زر «اللهم صلِّ وسلِّم على نبيّنا محمد» يُضغط بنبضات ضوء، ودعوة لكتابة الصلاة عليه في التعليقات، ثم كود التحميل.
     البيانات: {topic, items:[{id, label, pause?, hold?}], prayTitle, praySub} -->
<link rel="stylesheet" href="common.css">
<style>
.pray{left:110px;right:110px;top:820px;border-radius:40px;padding:44px 30px;font:700 62px/1.5 Amiri,serif;color:#1d2a28;text-align:center;
  background:linear-gradient(180deg,#e7c97a,#c9a24b);box-shadow:0 20px 50px rgba(201,162,75,.35),0 2px 0 rgba(255,255,255,.5) inset}
.ring{border-radius:50%;border:4px solid var(--gold)}
.moon{left:440px;top:560px;width:200px;height:200px}
</style>
</head>
<body>
<div id="bg" class="abs"></div>
<div id="pat" class="abs"></div>
<div id="root"></div>
<div id="vig" class="abs"></div>
<script src="common.js"></script>
<script>
const D = window.DATA;
const it = D.items[0];
it.pause = it.pause ?? 1.5;
it.hold = it.hold || 4.2;

// 1) البطاقة (العنوان وحده أولًا)
cardScene(it, D.topic);

// 2) الصلاة عليه ﷺ: الزر يُضغط ثلاث مرات بنبضات ضوء
const P = [1.6, 2.9, 4.2];
const subStart = 5.0, subN = D.praySub.split(' ').length;
scene(subStart + subN * .27 + 3.0, (el, s) => {
  const ch = chrome(el, s, { step: D.topic, title: D.prayTitle, sub: D.praySub, subStart });
  const moon = h(`<svg class="moon abs" viewBox="0 0 24 24" fill="#e7c97a"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>`); el.appendChild(moon);
  const btn = h(`<div class="pray abs">اللهم صلِّ وسلِّم على نبيّنا محمد</div>`); el.appendChild(btn);
  const rings = P.map(() => { const r = h('<div class="ring abs"></div>'); el.appendChild(r); return r; });
  sfx(s.start + .5, 'pop', .8);
  P.forEach((t, i) => sfx(s.start + t + .1, 'chime', .35 + .1 * i));
  return lt => {
    ch(lt);
    const m = eo(seg(lt, .3, .7)); css(moon, { opacity: m * (.85 + .15 * Math.sin(lt * 2)), transform: `translateY(${(1 - m) * 30}px) rotate(${-10 + 6 * Math.sin(lt * .8)}deg)` });
    const b = back(seg(lt, .5, .6));
    const press = P.reduce((a, t) => a + seg(lt, t - .1, .12) - seg(lt, t + .05, .2), 0);
    const glow = P.reduce((a, t) => a + seg(lt, t, .1) * (1 - seg(lt, t + .3, .7)), 0);
    css(btn, { opacity: clamp(b * 1.5), transform: `translateY(${(1 - b) * 60}px) scale(${1 - .05 * press})`, filter: `brightness(${1 + .25 * glow})` });
    const by = 820 + btn.offsetHeight / 2;
    rings.forEach((r, i) => {
      const q = seg(lt, P[i], 1.3), R = 80 + 1000 * eo(q);
      css(r, { width: R + 'px', height: R + 'px', left: (540 - R / 2) + 'px', top: (by - R / 2) + 'px', opacity: q > 0 && q < 1 ? (1 - q) * .8 : 0 });
    });
  };
});

qrScene();
finish();
</script>
</body>
</html>
