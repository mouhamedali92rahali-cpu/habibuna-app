<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>غلاف فيديو</title>
<!-- صورة غلاف (هوك) لفيديو تيك توك، 1080×1920. البيانات في الرابط بعد #: {tag, title, sub, art}. النص في وسط الشاشة لأن أزرار تيك توك تغطي الأسفل واليمين. -->
<link rel="stylesheet" href="../templates/common.css">
<style>
.tag{top:330px;left:50%;transform:translateX(-50%)}
.big{top:430px;left:70px;right:70px;text-align:center;font:700 108px/1.5 Amiri,serif;color:var(--ivory);text-shadow:0 6px 30px rgba(0,0,0,.5)}
.big .acc{color:var(--gold)}
.big .ul{display:none}
.disc{left:300px;top:960px;width:480px;height:480px;border-radius:50%;background:#f6efdd;box-shadow:0 0 0 10px rgba(217,178,94,.85),0 0 120px 30px rgba(217,178,94,.35),0 40px 90px rgba(0,0,0,.5);display:grid;place-items:center;overflow:hidden}
.disc svg{width:100%;height:100%}
.sub{top:1500px;font:700 56px Tajawal;color:var(--gold)}
</style>
</head>
<body>
<div id="bg" class="abs"></div>
<div id="pat" class="abs"></div>
<div id="vig" class="abs"></div>
<script src="../templates/common.js"></script>
<script>
const d = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const add = x => document.body.appendChild(h(x));
add(`<div class="badge tag abs"><div class="pill"><i></i>${d.tag.replace('ﷺ', '<span class="saw">ﷺ</span>')}</div></div>`);
add(`<div class="big abs">${words(d.title)}</div>`);
// الرسم من public/art، أو (بلا رسم) «ﷺ» كبيرة في وسط دائرة ذهبية
let inner = `<div style="font:400 300px/1 Amiri,serif;color:#b8923f;margin-top:-30px">ﷺ</div>`;
if (d.art) { const x = new XMLHttpRequest(); x.open('GET', '../../public/art/' + d.art + '.svg', false); x.send(); inner = x.responseText; }
add(`<div class="disc abs">${inner}</div>`);
add(`<div class="sub abs">${d.sub}</div>`);
</script>
</body>
</html>
