<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>كل ما في حبيبنا</title>
<!-- فيديو «كل ما في حبيبنا ﷺ» (docs/video-features-brief.md، 2026-11-04): نحو 40 ثانية.
     يبدأ بسؤال «كم مرة تذكّرتَ النبي ﷺ اليوم؟» ثم الشعار بتوهّج، ثم البطاقات الثلاث في اليوم (قوس النهار)، ثم التوثيق والشرح، ثم الجديد، كما في النسخة 3.22 (طلب المستخدم).
     نصوص البطاقات والسؤال والشرح من public/cards.json وpublic/quiz.json حرفيًّا. -->
<link rel="stylesheet" href="../templates/common.css">
<style>
/* الهاتف */
.phone{width:540px;height:980px;border-radius:78px;background:#05100d;padding:16px;box-shadow:0 50px 100px rgba(0,0,0,.6),0 0 0 3px #2b3b36}
.screen{position:relative;width:100%;height:100%;border-radius:64px;overflow:hidden;background:#eef0f2}
/* «تطبيق آخر»: منشورات رمادية بلا اسم ولا شعار */
.feed{position:absolute;inset:0;padding:110px 26px 0;display:flex;flex-direction:column;gap:22px;background:#f4f5f7}
.feed .bar{position:absolute;top:0;left:0;right:0;height:92px;background:#fff;box-shadow:0 1px 0 #e3e5e8}
.post{background:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 #e3e5e8}
.post .hd{display:flex;align-items:center;gap:12px}.post .av{width:48px;height:48px;border-radius:50%;background:#d6dade}
.post .ln{height:12px;border-radius:6px;background:#dfe2e6}.post .img{height:230px;border-radius:14px;background:linear-gradient(135deg,#cfd6dd,#e4e8ec)}
/* الفقاعة (BubbleService): دائرة عاجية بحلقة ذهبية وفي وسطها الشعار الدائري */
.bubble{width:112px;height:112px;border-radius:50%;background:#f7f1e2;box-shadow:0 0 0 5px #c9a24b,0 14px 30px rgba(0,0,0,.35);display:grid;place-items:center}
.bubble img{width:88px;height:88px;border-radius:50%;object-fit:cover}
.tap{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid rgba(255,255,255,.9)}
/* نافذة البطاقة (نسخة مصغّرة من public/popup.html بأشكالها نفسها) */
.pp{position:absolute;inset:0;font-size:19px;font-family:Tajawal,sans-serif;color:var(--ink);--frame:#0f5c4d;--gold:#c9a24b;--paper:#f7f1e2;--ink:#1d2a28;--soft:#e4ece6;
  background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--frame) 70%,transparent),transparent 70%),radial-gradient(90% 60% at 50% 100%,rgba(201,162,75,.18),transparent 70%),rgba(6,14,12,.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 22px}
.pp.t-ivory{--frame:#cdb67a;--gold:#a8822f;--ink:#3b2f12;--soft:#f1e8cf}
.pp .greet{color:#f3e7c4;font:400 1.25em Amiri,serif;text-align:center}
.pp .greet small{display:block;font:400 .78em Tajawal,sans-serif;opacity:.8;margin-top:2px}
.pp .pcard{width:100%;border-radius:24px;background:var(--frame);padding:13px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.pp .pin{position:relative;border-radius:14px;background:var(--paper);padding:26px 20px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--gold) 55%,transparent) inset}
.pp .corner{width:52px;height:52px;color:var(--gold)}
.pp .tl{top:4px;left:4px}.pp .tr{top:4px;right:4px}.pp .bl{bottom:4px;left:4px}.pp .br{bottom:4px;right:4px}
.pp .pk{font:400 .95em Amiri,serif;opacity:.8}
.pp .pt{font:700 1.4em/1.5 Amiri,serif;color:var(--frame);margin:6px 0 4px}.pp.t-ivory .pt{color:#6e5518}
.pp .px{font:400 1.08em/2 Naskh,'Noto Naskh Arabic',serif}
.pp .pd{display:flex;align-items:center;gap:8px;width:62%;margin:10px 0 8px}.pp .pd span{flex:1;height:1px;background:var(--gold)}.pp .pd i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.pp .ps{font-size:.78em;opacity:.9}.pp .pg{font-size:.72em;opacity:.7}
.pp .pray{width:100%;border-radius:16px;padding:13px;font:700 1.02em Amiri,serif;color:#1d2a28;text-align:center;background:linear-gradient(180deg,#e7c97a,#c9a24b)}
.pp .more{color:#f3e7c4;font-size:.85em;text-decoration:underline;text-underline-offset:4px;opacity:.9}
/* شاشة القفل */
.lock{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,#1d5e50,#0b1a16 75%)}
.lock .clock{position:absolute;top:150px;left:0;right:0;text-align:center;font:400 150px/1 Tajawal;color:#f3ede0;direction:ltr}
.lock .date{position:absolute;top:110px;left:0;right:0;text-align:center;font:700 32px Tajawal;color:rgba(243,237,224,.8)}
.lock .pad{position:absolute;bottom:70px;left:50%;margin-left:-40px;width:80px;height:80px;color:#f3ede0}
/* ثلاث بطاقات في اليوم */
.mini{width:300px;height:450px;border-radius:32px;padding:15px;background:var(--frame);box-shadow:0 30px 60px rgba(0,0,0,.5)}
.mini .in{width:100%;height:100%;border-radius:20px;background:#f7f1e2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 14px;text-align:center;color:var(--ink);box-shadow:0 0 0 2px color-mix(in srgb,var(--cg) 55%,transparent) inset}
.mini .t{font:700 70px Naskh,serif;direction:ltr;color:var(--tc)}
.mini .g{font:400 34px/1.4 Amiri,serif}
/* أزرار تحت البطاقة */
.btns{display:flex;gap:18px;justify-content:center}
.sb{padding:16px 28px;border-radius:18px;border:2.5px solid #c9a24b;background:#f7f1e2;color:#0f5c4d;font:700 34px Tajawal}
.sb.on{background:#0f5c4d;color:#f3e7c4;border-color:#0f5c4d}
.sharh{width:860px;border-radius:30px;background:#f7f1e2;color:#1d2a28;padding:30px 38px;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.sharh b{display:block;font:700 40px Amiri,serif;color:#0f5c4d;margin-bottom:8px}
.sharh p{font:400 34px/1.9 Naskh,Amiri,serif}.sharh small{display:block;margin-top:10px;font:400 26px Tajawal;opacity:.7}
/* الطرق الثلاث */
.mode{display:flex;flex-direction:column;align-items:center;gap:22px}
.mode .phone{width:300px;height:560px;border-radius:48px;padding:10px}.mode .screen{border-radius:40px}
.mode .cap{font:700 32px Tajawal;color:var(--ivory);padding:10px 26px;border-radius:99px;border:2px solid rgba(217,178,94,.45);white-space:nowrap}
.mode .cap.on{background:var(--gold);color:#12201c;border-color:var(--gold)}
.mode .pp{font-size:10.5px;gap:8px;padding:16px 12px}
.mode .feed{padding:62px 14px 0;gap:12px}.mode .feed .bar{height:52px}.mode .post{padding:10px;border-radius:12px;gap:7px}
.mode .post .av{width:26px;height:26px}.mode .post .ln{height:7px}.mode .post .img{height:120px}
.mode .bubble{width:62px;height:62px;box-shadow:0 0 0 3px #c9a24b,0 8px 18px rgba(0,0,0,.35)}.mode .bubble img{width:48px;height:48px}
.mode .lock .clock{top:80px;font-size:80px}.mode .lock .date{top:56px;font-size:18px}
/* اللوحة والخريطة */
.board{left:150px;width:780px;padding:40px 40px 30px;border-radius:44px;background:#f6efdd;box-shadow:0 40px 90px rgba(0,0,0,.5);text-align:center}
.board svg{width:100%;height:auto;display:block}
.board p{margin-top:16px;font:400 38px/1.5 Naskh,Amiri,serif;color:#1d2a28}
.board small{display:block;margin-top:6px;font:400 26px Tajawal;color:#6b7570}
.map{left:250px;width:580px;padding:22px;border-radius:44px;background:#f6efdd;box-shadow:0 40px 90px rgba(0,0,0,.5)}
.map svg{width:100%;height:auto;display:block}
/* المراجعة */
.quiz{left:110px;width:860px;padding:36px;border-radius:40px;background:#fbf6ea;color:#1f2b2a;box-shadow:0 40px 90px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:22px}
.quiz .qtop{display:flex;justify-content:space-between;font:400 30px Tajawal;color:#6b7570}
.quiz .qbar{height:10px;border-radius:9px;background:#e6dcc0;overflow:hidden}.quiz .qbar i{display:block;height:100%;width:42%;background:#b8923f}
.quiz .qcard{background:#fffaf0;border:2.5px solid #0f5c4d;border-radius:30px;padding:30px 28px;display:flex;flex-direction:column;gap:20px}
.quiz .qtext{font:700 44px/1.7 Amiri,serif}
.quiz .qopt{font:400 36px/1.5 Tajawal;padding:20px 24px;border-radius:22px;border:2.5px solid #e6dcc0;background:#fbf6ea}
.quiz .qopt.right{border-color:#2f7a45;background:#e3ede1;font-weight:700}
.quiz .qopt.dim{opacity:.55}
/* الصلاة والخط */
.praybtn{left:130px;width:820px;border-radius:32px;padding:32px 20px;font:700 46px Amiri,serif;color:#1d2a28;text-align:center;background:linear-gradient(180deg,#e7c97a,#c9a24b);box-shadow:0 16px 40px rgba(201,162,75,.35)}
.praycount{left:0;right:0;text-align:center;font:400 48px Amiri,serif;color:var(--gold)}
.ring{border-radius:50%;border:4px solid var(--gold)}
.fz{left:110px;width:860px;padding:36px 40px;border-radius:40px;background:#f7f1e2;color:#1d2a28;box-shadow:0 40px 90px rgba(0,0,0,.5);text-align:center}
.fz h4{font:700 42px Amiri,serif;color:#0f5c4d;margin-bottom:22px}
.fzrow{display:flex;justify-content:center;align-items:center;gap:30px;direction:ltr}
.fzrow .g{padding:12px 34px;border-radius:18px;border:2.5px solid #0f5c4d;color:#0f5c4d;font:700 44px Tajawal}
.fzrow .g.press{background:#0f5c4d;color:#f3e7c4}
.fzrow output{font:700 40px Naskh,serif;min-width:150px}
.fzdemo{margin-top:26px;font:400 40px/2 Naskh,'Noto Naskh Arabic',serif;transform-origin:50% 0}
.newtag{display:inline-block;margin-inline-start:14px;padding:4px 16px;border-radius:99px;background:var(--gold);color:#12201c;font:700 30px Tajawal;vertical-align:middle}
.chips{display:flex;gap:16px;justify-content:center}
.chips span{padding:12px 28px;border-radius:99px;border:2px solid rgba(217,178,94,.45);font:700 36px Tajawal;color:var(--gold)}
.applogo{width:300px;height:300px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 6px #c9a24b,0 40px 90px rgba(0,0,0,.6)}
.applogo img{width:100%;height:100%;object-fit:cover}
</style>

<body>
<div id="bg" class="abs"></div>
<div id="pat" class="abs"></div>
<div id="root"></div>
<div id="vig" class="abs"></div>
<script src="../templates/common.js"></script>
<script src="data.js"></script>
<script>
const LOGO = '../../public/logo.jpg';
// البطاقات والسؤال والرسم من ملفات التطبيق نفسها (data.js يولّده build-data.py)
const F = window.FEAT, CARDS = F.cards, QUIZ = F.quiz;

const SUN = `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>`;
const MOON = `<svg width="38" height="38" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>`;
const LOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="11" width="14" height="10" rx="2"/><path class="shackle" d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
const CORN = `<svg class="corner abs CLS" viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2h56M2 2v56" stroke-width="2.4"/><path d="M10 10h40M10 10v40"/><g transform="translate(34 34)"><rect x="-15" y="-15" width="30" height="30"/><rect x="-15" y="-15" width="30" height="30" transform="rotate(45)"/><circle r="5.5"/></g></g></svg>`;
const FLIP = { tl: '', tr: 'scaleX(-1)', bl: 'scaleY(-1)', br: 'scale(-1,-1)' };
const pcorners = () => Object.entries(FLIP).map(([k, f]) => CORN.replace('CLS', k).replace('<svg', `<svg style="transform:${f}"`)).join('');
const GREET = [['صباح النور ☀', 'موقفٌ من حياته ﷺ يرافقك اليوم'], ['وقفة قصيرة مع الحبيب ﷺ', 'دقيقة تُنعش قلبك وسط يومك'], ['مساء الخير 🌙', 'اختم يومك بالصلاة على الحبيب ﷺ']];
// نافذة البطاقة كما في public/popup.html (التحية والبطاقة والزرّ الذهبي والرابط)
function popupHTML(c, slot = 0) {
  const g = GREET[slot];
  return `<div class="pp t-${c.theme}"><div class="greet">${g[0].replace(/ [☀🌙]/, '')}<small>${g[1]}</small></div>
    <div class="pcard"><div class="pin">${pcorners()}<div class="pk">من مواقف النبي ﷺ</div><div class="pt">${c.title}</div>
    <div class="px">${c.text}</div><div class="pd"><span></span><i></i><span></span></div>
    <div class="ps">المصدر: ${bidiNums(c.source)}</div><div class="pg">${c.grade}</div></div></div>
    <div class="pray">اللهم صلِّ وسلِّم على نبيّنا محمد</div><div class="more">اقرأ المصدر والشرح في التطبيق</div></div>`;
}
const FEED = `<div class="feed"><div class="bar"></div>${'<div class="post"><div class="hd"><div class="av"></div><div class="ln" style="width:40%"></div></div><div class="img"></div><div class="ln"></div><div class="ln" style="width:70%"></div></div>'.repeat(2)}</div>`;
const BUBBLE = `<div class="bubble abs"><img src="${LOGO}"></div>`;
const M01 = CARDS.M01, Y04 = CARDS.Y04;


// إبطاء مشهد كامل بمعامل k (طلب المستخدم: إيقاع أهدأ لمن لا يعرف التطبيق): المدة والحركة والمؤثرات معًا
window.EXIT = .5; window.ENTER = .45;
function slow(k, dur, build) {
  return scene(dur * k, (el, s) => {
    const n0 = SFX.length, upd = build(el, s);
    for (let i = n0; i < SFX.length; i++) SFX[i].t = +(s.start + (SFX[i].t - s.start) * k).toFixed(3);
    return lt => upd(lt / k);
  });
}

// 0) الافتتاح (اختيار المستخدم): «كم مرة تذكّرتَ النبي ﷺ اليوم؟» ← «تطبيق» صغيرة، ثم الشعار (فيه اسم حبيبنا ﷺ) بتوهّج كالمفرقعات، ثم «يذكّرك به»
scene(5.0, (el, s) => {
  const CX = 540, CY = 760;
  const q = h(`<div class="abs" style="left:60px;right:60px;top:700px;text-align:center;font:700 112px/1.5 Amiri,serif">${words('كم مرة [تذكّرتَ] | النبي ﷺ اليوم؟')}</div>`); el.appendChild(q);
  // التوهّج: هالة كبيرة، وأشعة تدور، وحلقتان تتّسعان، وشرر ذهبي يتطاير كالمفرقعات
  const halo = h(`<div class="abs" style="left:${CX - 600}px;top:${CY - 600}px;width:1200px;height:1200px;border-radius:50%;background:radial-gradient(circle,rgba(255,227,154,.55),rgba(217,178,94,.28) 30%,transparent 62%)"></div>`); el.appendChild(halo);
  const rays = h(`<div class="abs" style="left:${CX - 650}px;top:${CY - 650}px;width:1300px;height:1300px;border-radius:50%;background:repeating-conic-gradient(rgba(255,227,154,.22) 0 4deg,transparent 4deg 15deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%)"></div>`); el.appendChild(rays);
  const rings = [0, 1].map(() => { const r = h(`<div class="ring abs" style="border-width:6px"></div>`); el.appendChild(r); return r; });
  const N = 44, sparks = [];
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2 + (i % 3) * .07, d = 330 + (i * 97 % 260), sz = 10 + (i * 37 % 14), dl = (i % 4) * .05;
    const e = h(`<div class="abs" style="width:${sz}px;height:${sz}px;margin:${-sz / 2}px 0 0 ${-sz / 2}px;border-radius:50%;background:${i % 3 ? '#ffe39a' : '#f3e7c4'};box-shadow:0 0 ${sz * 2}px ${sz / 2}px rgba(255,214,120,.8)"></div>`);
    el.appendChild(e); sparks.push({ e, a, d, dl });
  }
  const app = h(`<div class="abs" style="left:0;right:0;top:${CY - 330}px;text-align:center;font:400 58px Tajawal,sans-serif;color:#f3e7c4;letter-spacing:2px">تطبيق</div>`); el.appendChild(app);
  const lg = h(`<div class="applogo abs" style="left:${CX - 210}px;top:${CY - 210}px;width:420px;height:420px"><img src="${LOGO}"></div>`); el.appendChild(lg);
  const rem = h(`<div class="abs" style="left:0;right:0;top:${CY + 250}px;text-align:center;font:700 104px Amiri,serif">${words('[يذكّرك] به')}</div>`); el.appendChild(rem);
  wordTimes(q, .05, .1).forEach((t, i) => sfx(s.start + t, 'tick', i % 2 ? .7 : .85));
  const B = 2.35; // لحظة الانفجار
  sfx(s.start + 2.1, 'tick', .6); sfx(s.start + B, 'pop', 1); sfx(s.start + B + .05, 'chime', 1); sfx(s.start + B + .25, 'pop', .6); sfx(s.start + B + .45, 'pop', .45);
  wordTimes(rem, B + 1.0, .2).forEach(t => sfx(s.start + t, 'tick', .8));
  return lt => {
    revealWords(q, lt, .05, .1, { dy: 50, blur: 14 });
    const out = eo(seg(lt, 1.9, .4)); css(q, { opacity: 1 - out, transform: `translateY(${-out * 80}px)` });
    const ap = eo(seg(lt, 2.0, .4)); css(app, { opacity: ap * .9, transform: `translateY(${(1 - ap) * 20}px)` });
    const p = back(seg(lt, B, .7)); css(lg, { opacity: clamp(p * 1.5), transform: `scale(${.5 + .5 * p + .015 * Math.sin(lt * 2.4)})` });
    // الهالة تومض قويًّا لحظة الانفجار ثم تهدأ وتنبض
    const flash = seg(lt, B, .15) * (1 - seg(lt, B + .15, .9));
    css(halo, { opacity: clamp(eo(seg(lt, B, .4)) * (.7 + .2 * Math.sin(lt * 2.4)) + .6 * flash), transform: `scale(${.6 + .4 * eo(seg(lt, B, .6)) + .15 * flash})` });
    css(rays, { opacity: eo(seg(lt, B, .5)) * .9, transform: `rotate(${(lt - B) * 14}deg) scale(${.7 + .3 * eo(seg(lt, B, .8))})` });
    rings.forEach((r, i) => { const k = seg(lt, B + i * .22, 1.1), R = 300 + 1200 * eo(k); css(r, { width: R + 'px', height: R + 'px', left: (CX - R / 2) + 'px', top: (CY - R / 2) + 'px', opacity: k > 0 ? (1 - k) * .9 : 0 }); });
    for (const k of sparks) {
      const u = seg(lt, B + k.dl, 1.3), r = 160 + k.d * eo(u), fall = 90 * u * u;
      css(k.e, { left: (CX + r * Math.cos(k.a)) + 'px', top: (CY + r * Math.sin(k.a) + fall) + 'px', opacity: u > 0 ? Math.max(0, 1 - u * 1.05) * (.7 + .3 * Math.sin(lt * 30 + k.a * 5)) : 0 });
    }
    revealWords(rem, lt, B + 1.0, .2, { dy: 30, blur: 10 });
    const badge = document.querySelector('.logo'); if (badge) badge.style.opacity = '0';
  };
});

// 1) ثلاث بطاقات في يومك (بعد الافتتاح): قوس النهار، والشمس تمرّ عليه فتضيء المواعيد واحدًا واحدًا ثم يصير القمر
slow(1.2, 5.0, (el, s) => {
  const ch = chrome(el, s, { title: '[3] بطاقات في يومك', sub: 'مواقف قصيرة من حياته ﷺ', subStart: 1.6, subStep: .26 });
  const t0 = el.querySelector('.title');
  // نقاط القوس (من اليمين إلى اليسار كاتجاه القراءة): الصباح ثم وسط النهار ثم المساء
  const W = 900, H = 480, cx = 450, cy = 440, R = 380;
  const pt = a => [cx + R * Math.cos(a), cy - R * Math.sin(a)];
  const A = [Math.PI * .16, Math.PI * .5, Math.PI * .84];
  const lab = [['10:00', 'صباح النور'], ['15:00', 'وقفة قصيرة مع الحبيب ﷺ'], ['20:00', 'مساء الخير']];
  const sky = h(`<div class="abs" style="left:90px;top:540px;width:${W}px;height:${H + 260}px"></div>`); el.appendChild(sky);
  sky.innerHTML = `<svg class="abs" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="left:0;top:0;overflow:visible">
    <path id="arc" d="M ${cx + R} ${cy} A ${R} ${R} 0 0 0 ${cx - R} ${cy}" fill="none" stroke="#d9b25e" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 16"/>
    <line x1="20" y1="${cy}" x2="${W - 20}" y2="${cy}" stroke="rgba(243,231,196,.25)" stroke-width="3"/></svg>`;
  const dots = A.map((a, i) => { const [x, y] = pt(a); const d = h(`<div class="abs" style="left:${x - 26}px;top:${y - 26}px;width:52px;height:52px;border-radius:50%;background:#13221e;border:4px solid #d9b25e"></div>`); sky.appendChild(d); return d; });
  const tags = A.map((a, i) => { const [x, y] = pt(a); const t = h(`<div class="abs" style="left:${x - 150}px;top:${cy + 50}px;width:300px;text-align:center"><div style="font:700 76px Naskh,serif;direction:ltr;color:#f3e7c4">${lab[i][0]}</div><div style="font:400 42px/1.45 Amiri,serif;color:#d9b25e">${lab[i][1].replace('ﷺ', '<span class="saw">ﷺ</span>')}</div></div>`); sky.appendChild(t); return t; });
  const orb = h(`<div class="abs" style="width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;display:grid;place-items:center"></div>`); sky.appendChild(orb);
  const T = [.7, 1.45, 2.2];
  T.forEach(t => sfx(s.start + t, 'pop', .8));
  return lt => {
    ch(lt);
    // أول مشهد: العنوان كاملًا في أول نصف ثانية حتى لا تبقى الشاشة فارغة (درس أول فيديو)
    revealWords(t0, lt, 0, .1, { dy: 40, blur: 10 });
    css(sky, { opacity: eo(seg(lt, .1, .4)) });
    // الشمس تسير على القوس من الصباح إلى المساء، وتصير قمرًا في آخره
    const u = eo(seg(lt, .45, 1.9)), a = A[0] + (A[2] - A[0]) * u, [x, y] = pt(a), night = seg(lt, 1.9, .4);
    css(orb, { left: x + 'px', top: y + 'px', background: night > .5 ? 'transparent' : 'radial-gradient(circle,#ffe39a 40%,#e7c97a 60%,rgba(231,201,122,0) 72%)', color: '#f3e7c4' });
    orb.innerHTML = night > .5 ? MOON.replace('width="38" height="38"', 'width="80" height="80"') : '';
    dots.forEach((d, i) => { const on = eo(seg(lt, T[i], .3)); css(d, { background: on > .5 ? '#d9b25e' : '#13221e', boxShadow: `0 0 ${40 * on}px rgba(217,178,94,${.8 * on})`, transform: `scale(${1 + .25 * on * (1 - seg(lt, T[i] + .3, .4))})` }); });
    tags.forEach((t, i) => { const q = back(seg(lt, T[i], .45)); css(t, { opacity: clamp(q * 1.5), transform: `translateY(${(1 - q) * 30}px)` }); });
  };
});

// 2) موثّقة: بطاقة حقيقية ثم زرّا المصدر والشرح، والشرح من النووي
slow(1.3, 6.8, (el, s) => {
  const ch = chrome(el, s, { title: 'موثّقة [بمصدرها]', sub: 'وشرحٌ موجز من كتب العلماء', subStart: 2.9, subStep: .26 });
  const card = h(`<div class="abs" style="left:110px;top:520px;width:860px">${cardFace(Y04)}</div>`); el.appendChild(card);
  const btns = h(`<div class="btns abs" style="left:0;right:0"><div class="sb">إظهار مصدر الحديث</div><div class="sb">شرح موجز</div></div>`); el.appendChild(btns);
  const sh = h(`<div class="sharh abs" style="left:110px;top:520px"><b>شرح موجز</b><p>${Y04.sharh.text}</p><small>${Y04.sharh.source}</small></div>`); el.appendChild(sh);
  const tx = card.querySelector('.ctext'), b2 = btns.children[1];
  sfx(s.start + .3, 'pop'); sfx(s.start + 2.45, 'pop', .9);
  return lt => {
    ch(lt);
    btns.style.top = (520 + card.offsetHeight + 30) + 'px';
    const p = back(seg(lt, .2, .55)), out = eo(seg(lt, 2.5, .4));
    css(card, { opacity: clamp(p * 1.5) * (1 - out), transform: `translateY(${(1 - p) * 100 - out * 60}px)` });
    revealWords(tx, lt, .6, .14, { dy: 12, blur: 5 });
    const q = eo(seg(lt, 1.6, .4)); css(btns, { opacity: q * (1 - out), transform: `translateY(${(1 - q) * 30}px)` });
    b2.classList.toggle('on', lt > 2.3);
    css(b2, { transform: `scale(${1 - .06 * (seg(lt, 2.2, .1) - seg(lt, 2.35, .15))})` });
    const r = back(seg(lt, 2.6, .55)); css(sh, { opacity: clamp(r * 1.5), transform: `translateY(${(1 - r) * 80}px)` });
  };
});

// 3) على شاشتك كما تحب (جديد): خياران كما في النسخة 3.22: نافذة كاملة / فقاعة صغيرة
slow(1.2, 7.0, (el, s) => {
  const ch = chrome(el, s, { title: 'على شاشتك [كما] تحب', sub: 'النافذة تنتظر قليلًا | إن كنت في [مكالمة] أو تشاهد فيديو', subStart: 2.4, subStep: .24 });
  css(el.querySelector('.sub'), { fontSize: '44px', top: '1300px' });
  const ti = el.querySelector('.title'); ti.insertAdjacentHTML('beforeend', '<span class="newtag">جديد</span>');
  const tag = ti.querySelector('.newtag');
  const mk = (inner, cap) => { const m = h(`<div class="mode abs"><div class="phone"><div class="screen">${inner}</div></div><div class="cap">${cap}</div></div>`); el.appendChild(m); return m; };
  const ms = [
    mk(FEED + popupHTML(M01, 0), 'نافذة كاملة'),
    mk(FEED + BUBBLE, 'فقاعة صغيرة'),
  ];
  const bub = ms[1].querySelector('.bubble');
  css(bub, { right: '8px', top: '200px' });
  ms.forEach((_, i) => sfx(s.start + .4 + i * .9, 'pop', .8));
  return lt => {
    ch(lt);
    css(tag, { opacity: eo(seg(lt, .7, .3)), transform: `scale(${back(seg(lt, .7, .4))})` });
    ms.forEach((m, i) => {
      const a = .4 + i * .9, p = back(seg(lt, a, .5));
      css(m, { left: (600 - i * 420) + 'px', top: '560px', opacity: clamp(p * 1.5), transform: `translateY(${(1 - p) * 140}px)` });
      m.querySelector('.cap').classList.toggle('on', i === 0 ? lt > a + .2 && lt < 2.0 : lt > a + .2);
    });
    // الفقاعة تبقى صغيرة على الطرف وتنبض، فيظهر الفرق بين الطريقتين
    css(bub, { transform: `scale(${1 + .08 * Math.sin(lt * 7)})` });
  };
});

// 4) كل ثلاثة أيام رسم أو خريطة: الرسم يُرسم خطًّا خطًّا ثم لمحة من خريطة المدينة
slow(1.15, 5.6, (el, s) => {
  const ch = chrome(el, s, { title: 'كل [3] أيام رسم أو خريطة', sub: 'لتتخيّل ما ورد في الحديث', subStart: 2.2, subStep: .26 });
  const a = F.art, mp = F.map;
  const board = h(`<div class="board abs" style="top:520px">${a.svg}<p>${a.caption}</p><small>رسمٌ تقريبي للتوضيح</small></div>`); el.appendChild(board);
  const map = h(`<div class="map abs" style="top:500px">${mp.svg}</div>`); el.appendChild(map);
  const svg = board.querySelector('svg');
  const shapes = [...svg.querySelectorAll('path,circle,ellipse,rect,line,polyline,polygon')].filter(e => !e.closest('defs,mask,clipPath'));
  shapes.shift();
  const strokes = [], fills = [];
  for (const e of shapes) {
    const cs = getComputedStyle(e);
    if (cs.stroke && cs.stroke !== 'none' && parseFloat(cs.strokeWidth) > 0) { let L = 0; try { L = e.getTotalLength(); } catch {} if (L > 0) strokes.push({ e, L, w: Math.max(L, 40) }); }
    if (cs.fill && cs.fill !== 'none') fills.push({ e, op: cs.fillOpacity });
  }
  const DR = 1.9, tot = strokes.reduce((x, y) => x + y.w, 0); let acc = 0;
  for (const k of strokes) { k.a = .5 + acc / tot * DR; acc += k.w; k.d = k.w / tot * DR; k.e.style.strokeDasharray = k.L + ' ' + k.L; }
  sfx(s.start + .3, 'pop', .7); sfx(s.start + 3.3, 'whoosh', .6);
  return lt => {
    ch(lt);
    const out = eo(seg(lt, 3.1, .4)), p = eo(seg(lt, .1, .4));
    css(board, { opacity: p * (1 - out), transform: `translateY(${(1 - p) * 60 - out * 40}px)` });
    for (const k of strokes) { const q = clamp((lt - k.a) / Math.max(k.d, .08)); k.e.style.strokeDashoffset = String(k.L * (1 - eo(q))); k.e.style.visibility = q > 0 ? '' : 'hidden'; }
    const f = eo(seg(lt, 2.3, .6)); for (const k of fills) k.e.style.fillOpacity = String(f * (k.op ? parseFloat(k.op) : 1));
    board.querySelector('p').style.opacity = String(eo(seg(lt, 2.5, .4)));
    board.querySelector('small').style.opacity = String(eo(seg(lt, 2.7, .4)) * .8);
    const m = back(seg(lt, 3.3, .55)); css(map, { opacity: clamp(m * 1.5), transform: `translateY(${(1 - m) * 80}px) scale(${.95 + .05 * clamp(m)})` });
  };
});

// 5) مراجعة الأحد: سؤال حقيقي بأربعة خيارات، واختيار الصحيح
slow(1.2, 6.2, (el, s) => {
  const ch = chrome(el, s, { title: 'مراجعة [الأحد]', sub: 'أسئلة قصيرة مما مرّ بك في أسبوعك', subStart: 2.6, subStep: .24 });
  const opts = [QUIZ.w[1], QUIZ.a, QUIZ.w[2], QUIZ.w[0]];
  const qz = h(`<div class="quiz abs" style="top:500px"><div class="qtop"><span>مراجعة الأسبوع</span><span>3 / 7</span></div><div class="qbar"><i></i></div>
    <div class="qcard"><p class="qtext">${QUIZ.q.replace('ﷺ', '<span class="saw">ﷺ</span>')}</p>${opts.map(o => `<div class="qopt">${o}</div>`).join('')}</div></div>`);
  el.appendChild(qz);
  const os = [...qz.querySelectorAll('.qopt')], right = os[1];
  sfx(s.start + .3, 'pop'); sfx(s.start + 2.3, 'check');
  return lt => {
    ch(lt);
    const p = back(seg(lt, .2, .55)); css(qz, { opacity: clamp(p * 1.5), transform: `translateY(${(1 - p) * 100}px)` });
    os.forEach((o, i) => { const q = eo(seg(lt, .7 + i * .15, .35)); css(o, { opacity: q, transform: `translateX(${(1 - q) * -30}px)` }); });
    const picked = lt > 2.25;
    right.classList.toggle('right', picked); right.textContent = (picked ? '✓ ' : '') + QUIZ.a;
    os.forEach(o => o !== right && o.classList.toggle('dim', picked));
    css(right, { transform: `scale(${1 - .04 * (seg(lt, 2.1, .1) - seg(lt, 2.25, .15))})` });
  };
});

// 6) الصلاة على النبي ﷺ: الزرّ الذهبي وسطر العدّاد
slow(1.15, 3.4, (el, s) => {
  const ch = chrome(el, s, { title: '[صلِّ] عليه ﷺ' });
  const btn = h(`<div class="praybtn abs" style="top:760px">اللهم صلِّ وسلِّم على نبيّنا محمد</div>`); el.appendChild(btn);
  const ring = h(`<div class="ring abs"></div>`); el.appendChild(ring);
  const cnt = h(`<div class="praycount abs" style="top:1000px">✦ صلّيت على النبي <span class="saw">ﷺ</span> هذا الأسبوع 7 مرات</div>`); el.appendChild(cnt);
  sfx(s.start + .3, 'pop'); sfx(s.start + 1.25, 'chime');
  return lt => {
    ch(lt);
    const b = back(seg(lt, .2, .5)), press = seg(lt, 1.1, .12) - seg(lt, 1.25, .2);
    css(btn, { opacity: clamp(b * 1.5), transform: `translateY(${(1 - b) * 60}px) scale(${1 - .05 * press})`, filter: `brightness(${1 + .25 * seg(lt, 1.2, .1) * (1 - seg(lt, 1.6, .5))})` });
    const r = seg(lt, 1.2, 1.0), R = 60 + 900 * eo(r);
    css(ring, { width: R + 'px', height: R + 'px', left: (540 - R / 2) + 'px', top: (820 - R / 2) + 'px', opacity: r > 0 ? (1 - r) * .8 : 0 });
    const c = eo(seg(lt, 1.6, .5)); css(cnt, { opacity: c, transform: `translateY(${(1 - c) * 20}px)` });
  };
});

// 7) حجم الخط (جديد): A− / A+ والنص يكبر
slow(1.15, 3.8, (el, s) => {
  const ch = chrome(el, s, { title: 'كبّر [الخط] كما يريحك' });
  const ti = el.querySelector('.title'); ti.insertAdjacentHTML('beforeend', '<span class="newtag">جديد</span>');
  const tag = ti.querySelector('.newtag');
  const fz = h(`<div class="fz abs" style="top:540px"><h4>حجم الخط</h4><div class="fzrow"><div class="g">A−</div><output>100٪</output><div class="g">A+</div></div>
    <p class="fzdemo">كان رسول الله ﷺ من أحسن الناس خُلُقًا.</p></div>`); el.appendChild(fz);
  const out = fz.querySelector('output'), plus = fz.querySelectorAll('.g')[1], demo = fz.querySelector('.fzdemo');
  const steps = [[1.0, 110], [1.5, 120], [2.0, 140]];
  steps.forEach(([t]) => sfx(s.start + t, 'tick', .8));
  return lt => {
    ch(lt);
    css(tag, { opacity: eo(seg(lt, .5, .3)), transform: `scale(${back(seg(lt, .5, .4))})` });
    const p = back(seg(lt, .15, .5)); css(fz, { opacity: clamp(p * 1.5), transform: `translateY(${(1 - p) * 80}px)` });
    let v = 100; for (const [t, n] of steps) if (lt >= t) v = n;
    out.textContent = v + '٪';
    plus.classList.toggle('press', steps.some(([t]) => lt >= t - .05 && lt < t + .15));
    demo.style.fontSize = (40 * v / 100) + 'px';
  };
});

// 8) الختام: مجاني · بلا حساب · بلا إعلانات
slow(1.2, 2.4, (el, s) => {
  const ti = h(`<div class="title abs" style="top:300px">${words('[حبيبنا] ﷺ')}</div>`); el.appendChild(ti);
  const lg = h(`<div class="applogo abs" style="left:390px;top:540px"><img src="${LOGO}"></div>`); el.appendChild(lg);
  const chips = h(`<div class="chips abs" style="left:0;right:0;top:960px"><span>مجاني</span><span>بلا حساب</span><span>بلا إعلانات</span></div>`); el.appendChild(chips);
  const cs = [...chips.children];
  sfx(s.start + .2, 'pop'); [.7, .85, 1.0].forEach(t => sfx(s.start + t, 'check', .45));
  return lt => {
    revealWords(ti, lt, .05, .12, { dy: 40, blur: 10 });
    const p = back(seg(lt, .1, .5)); css(lg, { opacity: clamp(p * 1.5), transform: `scale(${.7 + .3 * p})` });
    cs.forEach((c, i) => { const k = back(seg(lt, .7 + i * .15, .4)); css(c, { opacity: clamp(k * 1.5), transform: `scale(${.7 + .3 * k})` }); });
  };
});

qrScene();
finish();
</script>
