# ينشر نسخة الويب على GitHub Pages مع كل تحديث على main
# الرابط: https://mouhamedali92rahali-cpu.github.io/habibuna-app/
# تعديل public/cards.json وحده يكفي لنشر البطاقات الجديدة (دقيقة تقريبًا)، وتصل لتطبيق الهاتف أيضًا.
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'vite.config.ts', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
