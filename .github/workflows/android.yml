# يبني APK للتجربة مع كل تحديث على main، وينشره في إصدار ثابت اسمه apk-latest
# ومع كل رقم نسخة جديد (versionName في android/app/build.gradle) ينشئ إصدارًا دائمًا v<النسخة> لا يُستبدل أبدًا،
# فيتراكم عدّ التحميلات فيه؛ وصفحة التحميل تشير إلى أحدثها: releases/latest/download/habibuna.apk
# (العدد الكلي = مجموع download_count لإصدارات v*، و33 تحميلًا قبل ذلك من apk-latest حتى 2026-10-31)
# (رابط التحميل: https://github.com/mouhamedali92rahali-cpu/habibuna-app/releases/tag/apk-latest)
name: Android APK

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'android/**', 'package.json', 'package-lock.json', 'capacitor.config.ts', 'index.html', 'vite.config.ts', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk habibuna-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: habibuna-debug-apk
          path: habibuna-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: حبيبنا — نسخة التجربة (APK)
          body: |
            نسخة تجريبية للأندرويد، تُبنى تلقائيًّا من آخر تحديث على main.
            حمّل الملف habibuna-debug.apk على الهاتف وثبّته (يلزم السماح بالتثبيت من مصادر غير معروفة).
            آخر بناء: ${{ github.sha }}
          prerelease: true
          files: habibuna-debug.apk
      - name: إصدار دائم لكل رقم نسخة (لا يُستبدل، ليتراكم عدّ التحميلات)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
          cp habibuna-debug.apk habibuna.apk
      - if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: حبيبنا ${{ steps.ver.outputs.v }}
          body: |
            حبيبنا — النسخة ${{ steps.ver.outputs.v }} للأندرويد.
            حمّل الملف habibuna.apk على الهاتف وثبّته فوق النسخة القديمة (تبقى المفضلة والإعدادات).
          prerelease: false
          make_latest: true
          files: habibuna.apk
